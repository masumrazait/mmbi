<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Register - Mannat Bank</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/css/styles.css" rel="stylesheet" />
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2" href="../index.html"><img src="../assets/img/logo.svg" alt="logo" class="brand-logo"> <span class="brand-text">Mannat Bank</span></a>
  </div>
</nav>

<main class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card p-4 shadow">
        <h4>Open an Account (Register)</h4>
        <form id="regForm">
          <div class="row">
            <div class="mb-3 col-md-6">
              <label class="form-label">Full Name</label>
              <input id="regName" class="form-control" required />
            </div>
            <div class="mb-3 col-md-6">
              <label class="form-label">Email</label>
              <input id="regEmail" type="email" class="form-control" required />
            </div>
            <div class="mb-3 col-md-6">
              <label class="form-label">Mobile</label>
              <input id="regMobile" class="form-control" required />
            </div>
            <div class="mb-3 col-md-6">
              <label class="form-label">Password</label>
              <input id="regPass" type="password" class="form-control" required />
            </div>
            <div class="mb-3 col-md-12">
              <label class="form-label">Initial Account Type</label>
              <select id="regAcctType" class="form-select">
                <option value="savings">Savings</option>
                <option value="current">Current</option>
                <option value="fd">Fixed Deposit</option>
              </select>
            </div>
            <div class="mb-3 col-md-12">
              <label class="form-label">Opening Amount (₹)</label>
              <input id="regInit" type="number" class="form-control" value="0" required />
            </div>
            <div class="mb-3 col-md-12">
              <label class="form-label">Upload PAN / Aadhaar </label>
              <input id="regKyc" type="file" class="form-control" required />
            </div>
          </div>
          <div class="d-flex gap-2">
            <button class="btn btn-success" type="submit">Create Account</button>
            <a class="btn btn-secondary" href="../index.html">Back to Login</a>
          </div>
        </form>
        <div id="regMsg" class="mt-3"></div>
      </div>
    </div>
  </div>
</main>

<script src="../assets/js/app.js"></script>
</body>
</html>
